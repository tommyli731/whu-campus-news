 s:"武汉大学教授王顺课题组在国际行星科学领域期刊Journal of Geophysical Research: Planets发表论文，武汉大学为第一署名单位。",
 b:"新闻网讯近日，武汉大学教授王顺课题组在美国地球物理联合会（AGU）旗下国际行星科学领域期刊Journal of Geophysical Research: Planets发表研究论文，论文题为“High-Fidelity Lunar Mare Agglutinates and Their Mechanical Effects on Lunar Regolith Simulants”。王顺为论文第一作者和通讯作者，博士研究生滕越为第二作者，清华大学副教授崔一飞、博士研究生罗奥及武汉大学教授李典庆为共同作者。武汉大学为第一署名单位。该研究揭示了月壤颗粒在聚合过程中力学行为的调控机制，为理解月壤在复杂载荷下的稳定性提供了新方法。可作为本科生科研启蒙与研究生课题选择的参考案例。"},
{id:4,t:"邹秀芬团队在肿瘤免疫空间模式的机理与数据融合建模研究中取得新进展",d:"2026-10-12",c:"academic",lv:"A",aud:"tea",
 org:"科学技术发展研究院 / 武汉大学新闻网",by:"通讯员 数轩",col:"学术动态",url:"http://news.whu.edu.cn/info/1015/504887.htm",
 s:"武汉大学数学与统计学院教授邹秀芬团队在PNAS发表论文，武汉大学为论文第一署名单位。",

// ============================================================
// 实时数据层：尝试加载爬虫生成的 data_news.json
// - 加载成功：用最新采集数据替换静态兜底数据
// -加载失败：保留内置静态数据，页面功能不受影响
// ============================================================
let DATA_META={updated:'',source:'内置静态数据',live:false};
function applyLiveData(payload){
 if(!payload||!Array.isArray(payload.items)||!payload.items.length) return false;
 const valid=payload.items.filter(x=>x&&x.t&&x.d&&/^\d{4}-\d{2}-\d{2}$/.test(x.d)&&/^https?:/.test(x.url||''));
 if(valid.length<3) return false;

 const byUrl={};
 NEWS.forEach(n=>{byUrl[(n.url||'').split('?')[0]]=n});

 let added=0,updated=0;
 valid.forEach(it=>{
   const key=(it.url||'').split('?')[0];
   const old=byUrl[key];
   if(old){
     // 已有条目：用新数据补全摘要/正文（保留人工精修的正文）
     if(it.s&&it.s.length>(old.s||'').length){old.s=it.s;updated++}
     if(it.org)old.org=it.org;
     if(it.by)old.by=it.by;
     if(it.lv)old.lv=it.lv;
     if(it.c)old.c=it.c;
     if(it.aud)old.aud=it.aud;
   }else{
     NEWS.push({
       id:'L'+Math.abs(hashStr(it.url||it.t)),
       t:it.t,d:it.d,c:it.c||'headline',lv:it.lv||'B',aud:it.aud||'both',
       org:it.org||it.ch||'武汉大学',by:it.by||'记者团队',col:it.col||'资讯',
       url:it.url,s:it.s||it.t,b:it.b||it.s||it.t,_live:true
     });
     byUrl[key]={};
     added++;
   }
 });
 if(!added&&!updated) return false;
 DATA_META={updated:payload.updated_at||'',source:'实时采集数据',live:true};
 return true;
}
function hashStr(s){let h=0;for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0}return h}

fetch('data_news.json?'+Date.now())
 .then(r=>r.ok?r.json():Promise.reject('HTTP '+r.status))
 .then(j=>{if(applyLiveData(j)){render();updateMeta()}})
 .catch(()=>{/* 静默降级，保留静态数据 */});

function updateMeta(){
 const el=document.getElementById('gen-time');
 if(el&&DATA_META.live)el.textContent=DATA_META.updated;
 const st=document.getElementById('data-state');
 if(st)st.textContent=DATA_META.live?'实时采集':'内置快照';
}

"武大要闻":"武汉大学新闻网","综合新闻":"武汉大学新闻网","学术动态":"武汉大学新闻网",
"缤纷校园":"武汉大学新闻网","珞珈人物":"武汉大学新闻网","创新武大":"武汉大学新闻网",
"珞珈讲坛":"武汉大学主站","通知公告":"通知公告（主站栏）",
"红色武大":"党委宣传部官网","笃行武大":"党委宣传部官网"
};

let S={p:"home",aud:"all",cat:null,q:"",sort:"date",ch:null};

function byAud(a){return a==="all"?NEWS:NEWS.filter(n=>n.aud===a||n.aud==="both")}
function sorted(list){
 let l=[...list];
 if(S.sort==="date")l.sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id);
 else if(S.sort==="dateAsc")l.sort((a,b)=>a.d.localeCompare(b.d)||a.id-b.id);
 else {const w={S:3,A:2,B:1};l.sort((a,b)=>(w[b.lv]-w[a.lv])||(b.d.localeCompare(a.d)))}
 return l;
}
function audTag(a){return a==="both"?'<span class="tag a-all">师生通用</span>':`<span class="tag a-${a}">${AUD[a]}向</span>`}
function cat(c){return `<span class="tag c-${c}">${CATS[c]}</span>`}
function lv(l){return `<span class="tag t-${l}">${l}级</span>`}

// 全站统一来源展示组件：栏目 · 发布机构 · 作者 · 原文链接
// （实际定义见下方"来源相关组件"，含来源详情关联与外链标识）

function item(n){
 return `<div class="it" onclick="openArticle(${n.id})">
  <h4>${n.t}</h4>
  <div class="meta">${audTag(n.aud)}${cat(n.c)}${lv(n.lv)}<span>${n.d}</span></div>
  ${srcline(n)}
 </div>`;
}
function empty(txt,act){
 return `<div class="empty"><div class="ei">◍</div><h4>${txt}</h4><p>当前筛选条件下没有匹配的资讯，可尝试调整分类、切换身份或清空搜索关键词。</p>${act?'<button onclick="resetAll()">清空筛选条件</button>':''}</div>`;
}
function filterbar(){
 let l=byAud(S.aud);
 let c=Object.entries(CATS).map(([k,v])=>`<span class="chip ${S.cat===k?'on':''}" onclick="setCat('${k}')">${v}（${l.filter(n=>n.c===k).length}）</span>`).join("");
 return `<div class="filterbar"><span class="fb-l">分类</span><div class="chips">${c}</div></div>
 <div class="filterbar"><span class="fb-l">排序</span>
  <select onchange="setSort(this.value)">
   <option value="date" ${S.sort==="date"?'selected':''}>最新发布在前</option>
   <option value="dateAsc" ${S.sort==="dateAsc"?'selected':''}>最早发布在前</option>
   <option value="lv" ${S.sort==="lv"?'selected':''}>重要程度优先</option>
  </select>
  <span class="fb-l">当前身份</span><div class="chips">${audChips()}</div>
  <span class="cnt">共 ${l.length} 条</span></div>`;
}
function audChips(){
 return [['all','全部'],['stu','学生'],['tea','教师']].map(([k,v])=>
  `<span class="chip ${S.aud===k?'on':''}" onclick="setAud('${k}')">${v}${k!=='all'?`（${NEWS.filter(n=>n.aud===k||(k==='stu'&&n.aud==='both')).length}）`:''}</span>`).join("");
}
function audTabs(){
 return `<div class="audtabs">
  <div class="audtab ${S.aud==='stu'?'on':''}" onclick="goAud('stu')">
   <div class="an"><span class="audico i-stu">学</span>学生资讯</div>
   <div class="ad">面向在校学生的教务、学工、文体与科研启蒙类资讯</div></div>
  <div class="audtab ${S.aud==='tea'?'on':''}" onclick="goAud('tea')">
   <div class="an"><span class="audico i-tea">教</span>教师资讯</div>
   <div class="ad">面向教职工的科研进展、人事事务、党团与青年教师成长类资讯</div></div>
  <div class="audtab ${S.aud==='all'?'on':''}" onclick="goAud('all')">
   <div class="an"><span class="audico i-all">全</span>全部资讯</div>
   <div class="ad">不区分身份，浏览两类人群的完整信息流</div></div>
 </div>`;
}
function side(){
 let l=byAud(S.aud);
 let notices=l.filter(n=>n.c==="notice");
 return `<div class="box"><h3>当前视角</h3><div style="font-size:13px;color:var(--sub)">${S.aud==='all'?'全部资讯（师生通用视角）':S.aud==='stu'?'仅面向学生的资讯':"仅面向教师的资讯"}<br>共 ${l.length} 条</div></div>
 <div class="box"><h3>重要通知快查</h3>
  ${notices.length?notices.map(n=>`<div class="it" style="cursor:pointer" onclick="openArticle(${n.id})"><div style="font-size:14px;font-weight:500;margin-bottom:4px">${n.t}</div><div class="meta"><span class="deadline">有截止日期</span><span>${n.d}</span></div></div>`).join(""):'<p style="font-size:13px;color:var(--sub)">该视角下暂无通知公告</p>'}
 </div>
 <div class="box"><h3>浏览类别</h3><div class="chips">${Object.entries(CATS).map(([k,v])=>`<span class="chip ${S.cat===k?'on':''}" onclick="setCat('${k}')">${v}（${l.filter(n=>n.c===k).length}）</span>`).join("")}</div></div>
 <div class="box"><h3>核心渠道直达</h3>
  ${CHANNELS.slice(0,6).map(c=>`<div style="margin-bottom:10px"><span class="srclink" onclick="openSource('${c.n}')">${c.n}</span><div style="font-size:11px;color:var(--sub);margin-top:2px">${chInfo(c.n)[0]} · ${c.u}</div></div>`).join("")}
  <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line)"><span class="srclink" onclick="go('sources')">查看全部 ${CHANNELS.length} 个来源 ›</span></div>
 </div>`;
}

function renderFeed(){
 let l=sorted(S.q?byAud(S.aud).filter(n=>(n.t+n.s+n.col+n.org+n.by).includes(S.q)):byAud(S.aud));
 let feat=l[0];
 const AUDMETA={
  stu:{k:'学生视角 · 今日要闻',h:'面向学生的资讯',d:'教务安排、学工事务、文体活动与科研启蒙。此类信息面向在校本科生与研究生，与教师资讯分开呈现，互不混杂。'},
  tea:{k:'教师视角 · 今日要闻',h:'面向教师的资讯',d:'科研进展与成果、人事与党团事务、学术讲座与青年教师成长。此类信息面向教职员工，与学生资讯分开呈现，互不混杂。'},
  all:{k:'今日要闻',h:'全部资讯',d:'不区分身份，浏览面向学生与教师两类人群的完整信息流。标注“师生通用”的资讯对两类人群均重要。'}
 };
 const m=AUDMETA[S.aud];
 let head = S.aud==='all'?'':`<div class="card" style="border-left:3px solid ${S.aud==='stu'?'var(--stu)':'var(--tea)'}">
   <div style="font-size:16px;font-weight:600;margin-bottom:6px">${m.h}</div>
   <div style="font-size:13px;color:var(--sub)">${m.d}</div>
   <div class="meta" style="margin-top:10px">${S.aud==='stu'?'<span class="tag a-stu">学生向</span>':'<span class="tag a-tea">教师向</span>'}<span class="tag a-all">师生通用 ${NEWS.filter(n=>n.aud==='both').length} 条</span><span>本视角共 ${l.length} 条</span></div>
  </div>`;
 let body = l.length?`
  <div class="hero"><div class="top">
   <div class="kicker">${m.k}</div>
   <h3 onclick="openArticle(${feat.id})">${feat.t}</h3>
   <p>${feat.s}</p>
   <div class="meta">${audTag(feat.aud)}${cat(feat.c)}${lv(feat.lv)}<span>${feat.d}</span></div>
   ${srcline(feat)}
  </div></div>
  <h2 class="sec">最新资讯</h2>
  <div class="card list">${l.slice(1,9).map(item).join("")||'<div class="empty" style="padding:24px"><p>该视角下暂无更多资讯</p></div>'}</div>
  <h2 class="sec">全部条目</h2>
  <div class="card list">${l.slice(9).map(item).join("")}</div>
 `:empty('没有匹配的资讯');
 return `${audTabs()}${head}${filterbar()}<div class="layout"><div>${body}</div><aside>${side()}</aside></div>`;
}

function renderTimeline(){
 let l=sorted(byAud(S.aud).filter(n=>!S.q||(n.t+n.s+n.col+n.org+n.by).includes(S.q)));
 let groups={};
 l.forEach(n=>{(groups[n.d]=groups[n.d]||[]).push(n)});
 let days=Object.keys(groups).sort().reverse();
 let nav=`<div class="filterbar"><span class="fb-l">身份</span><div class="chips">${audChips()}</div></div>`;
 if(!l.length)return `<h2 class="sec">资讯时间线</h2>${nav}${empty('时间线中没有匹配的资讯')}`;
 return `<h2 class="sec">资讯时间线 · 2026-10-01 至 10-13</h2>${nav}
 ${days.map(d=>`<div class="tl-day"><div class="tl-date"><span>${d}</span><span class="n">${groups[d].length} 条</span><span class="ln"></span></div>
 <div class="card list">${groups[d].map(item).join("")}</div></div>`).join("")}`;
}

function renderCategory(){
 let c=S.cat||"headline";
 let l=sorted(byAud(S.aud).filter(n=>n.c===c));
 let nav=`<div class="filterbar"><span class="fb-l">身份</span><div class="chips">${audChips()}</div>
 <span class="fb-l">分类</span><div class="chips">${Object.entries(CATS).map(([k,v])=>`<span class="chip ${k===c?'on':''}" onclick="setCat('${k}')">${v}</span>`).join("")}</div></div>
 <div class="filterbar"><span class="fb-l">排序</span>
  <select onchange="setSort(this.value)">
   <option value="date" ${S.sort==="date"?'selected':''}>最新发布在前</option>
   <option value="dateAsc" ${S.sort==="dateAsc"?'selected':''}>最早发布在前</option>
   <option value="lv" ${S.sort==="lv"?'selected':''}>重要程度优先</option>
  </select><span class="cnt">${CATS[c]} · 共 ${l.length} 条</span></div>`;
 if(!l.length)return `<h2 class="sec">${CATS[c]}</h2>${nav}${empty(`「${CATS[c]}」分类下暂无${S.aud==='all'?'':(S.aud==='stu'?'学生':'教师')}相关资讯`)}`;
 return `<h2 class="sec">${CATS[c]}</h2>${nav}<div class="card list">${l.map(item).join("")}</div><div style="margin-top:20px">${side()}</div>`;
}

// ---- 来源相关组件 ----
const EXT='<svg class="ico" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M8.5 6v3.2a1.3 1.3 0 0 1-1.3 1.3H3.3A1.3 1.3 0 0 1 2 9.2V5.3A1.3 1.3 0 0 1 3.3 4h3.2"/><polyline points="7.6 1.8 10.6 1.8 10.6 4.8"/><line x1="10.6" y1="1.8" x2="6.4" y2="6"/></svg>';
const EXTT='<span class="extmark">'+EXT+' 外部网站</span>';
function chInfo(n){return CDESC[n]||[CHANNELS.find(c=>c.n===n)?.t||"其他渠道","暂无简介说明。","暂未收录内容范围"]}
function chNameOf(n){return COLMAP[n.col]||(CHANNELS.find(c=>c.n===n.org)?n.org:"武汉大学主站")}

// 列表项来源行：栏目·机构·作者 + 关联来源链接 + 原文链接
function srcline(n){
 return `<div class="srcline">来源栏目：${n.col} ｜ 发布机构：${n.org} ｜ 作者：${n.by} ｜
 <span class="srclink" onclick="event.stopPropagation();openSource('${chNameOf(n)}')">来源详情</span> ｜
 <a href="${n.url}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">${EXT} 原文链接</a></div>`;
}
// 来源卡片
function srcCard(c){
 const d=chInfo(c.n);
 return `<div class="srccard">
  <div class="srchd"><h4 onclick="openSource('${c.n}')">${c.n}</h4><span class="typetag">${d[0]}</span></div>
  <div class="srcunit">${c.u}</div>
  <div class="srcdesc">${d[1]}</div>
  <div class="srcscope"><strong>内容范围：</strong>${d[2]}</div>
  <div class="srcfoot">${lv(c.lv)}
   <a class="linkbtn" href="${c.url}" target="_blank" rel="noopener noreferrer">${EXT} 访问官网</a>
   <span class="linkbtn ghost" onclick="openSource('${c.n}')">来源详情</span>
  </div>
  <div style="font-size:11px;color:var(--sub);margin-top:9px">${EXTT}链接在新标签页打开，不影响当前浏览</div>
 </div>`;
}
// 来源详情弹窗
function openSource(name){
 const c=CHANNELS.find(x=>x.n===name);
 if(!c){document.getElementById("modal").innerHTML=`<div class="mask" onclick="if(event.target===this)closeModal()"><div class="mbox"><div class="mhd"><h3>${name}</h3><button class="mclose" onclick="closeModal()">×</button></div><div class="mbd"><p style="font-size:14px;color:var(--sub)">该渠道暂未收录详细信息。</p></div></div></div>`;return}
 const d=chInfo(c.n);
 const rel=NEWS.filter(n=>chNameOf(n)===name);
 document.getElementById("modal").innerHTML=`<div class="mask" onclick="if(event.target===this)closeModal()">
 <div class="mbox">
  <div class="mhd"><h3>${c.n}</h3><button class="mclose" onclick="closeModal()" aria-label="关闭">×</button></div>
  <div class="mbd">
   <div class="mrow"><div class="lb">来源类型</div><div class="vl"><span class="typetag">${d[0]}</span></div></div>
   <div class="mrow"><div class="lb">所属单位</div><div class="vl">${c.u}</div></div>
   <div class="mrow"><div class="lb">重要程度</div><div class="vl">${lv(c.lv)} <span style="font-size:12px;color:var(--sub)">${c.lv==='S'?'权威发布口，影响全校师生':c.lv==='A'?'官方媒体与业务系统':'垂直、专题或校园媒体'}</span></div></div>
   <div class="mrow"><div class="lb">简介</div><div class="vl">${d[1]}</div></div>
   <div class="mrow"><div class="lb">内容范围</div><div class="mscope">${d[2]}</div></div>
   <div class="mfoot">
    <a class="linkbtn" href="${c.url}" target="_blank" rel="noopener noreferrer">${EXT} 访问官方网站</a>
    ${EXTT}
    <span style="font-size:12px;color:var(--sub)">链接将在新标签页打开，不影响当前浏览</span>
   </div>
   ${rel.length?`<div style="margin-top:22px;padding-top:18px;border-top:1px solid var(--line)">
     <div class="lb" style="font-size:11px;color:var(--sub);margin-bottom:10px">该来源提供的资讯（${rel.length} 条）</div>
     <div class="list">${rel.map(item).join("")}</div></div>`:`<div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--sub)">本站暂未从该来源采集到10 月 1 日以来的资讯。</div>`}
  </div>
 </div></div>`;
 document.body.style.overflow="hidden";
}
function closeModal(){document.getElementById("modal").innerHTML="";document.body.style.overflow=""}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});

function renderSources(){
 const l=sorted(byAud(S.aud));
 let shown=CHANNELS.filter(c=>S.q?((c.n+c.u+c.t+c.c).includes(S.q)||(chInfo(c.n)[0]+chInfo(c.n)[1]+chInfo(c.n)[2]).includes(S.q)):true);
 const relCh=[...new Set(l.map(n=>chNameOf(n)))];
 return `<h2 class="sec">资讯来源说明</h2>
 <p style="font-size:13px;color:var(--sub);margin-bottom:14px">本站所有资讯均来自下列官方渠道，每条资讯均标注来源栏目、发布机构、作者与原文链接。点击「来源详情」可查看该渠道的简介与内容范围；点击「访问官网」将在新标签页打开对应官方网站，不打断当前浏览状态。</p>
 <div class="filterbar"><input id="q" placeholder="搜索来源名称、类型或内容范围…" value="${S.q}">
  <span class="cnt">共 ${shown.length} 个来源</span></div>
 <div class="card" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
  <span class="fb-l">快速定位本视角正在引用的来源</span>
  <div class="chips">${relCh.map(n=>`<span class="chip on" onclick="openSource('${n}')">${n}（${l.filter(x=>chNameOf(x)===n).length}）</span>`).join("")}</div>
 </div>
 ${shown.length?`<div class="srcgrid" style="margin-top:16px">${shown.map(srcCard).join("")}</div>`
 :empty('没有匹配的来源',1)}`;
}

function renderChannels(){
 return `<h2 class="sec">官方渠道清单</h2>
 <p style="font-size:13px;color:var(--sub);margin-bottom:16px">以官方“智慧珞珈”为起点反向梳理的完整渠道台账，共 ${CHANNELS.length} 个。重要程度：<span class="tag t-S">S级</span> 权威发布口（影响全校，必须接入）；<span class="tag t-A">A级</span> 官方媒体与业务系统；<span class="tag t-B">B级</span> 垂直/专题/校园媒体。所有链接均为<b>外部网站</b>，将在新标签页打开。</p>
 <div class="filterbar"><input id="q" placeholder="搜索渠道名称、单位或内容类型…" value="${S.q}"><span class="cnt">共 ${CHANNELS.length} 个渠道</span></div>
 <div class="tblwrap"><table><thead><tr><th>渠道名称</th><th>所属单位</th><th>类型</th><th>内容类型</th><th>重要程度</th><th>详情</th><th>入口</th></tr></thead><tbody>
 ${CHANNELS.map(c=>`<tr><td><strong>${c.n}</strong></td><td>${c.u}</td><td>${chInfo(c.n)[0]}</td><td style="color:var(--sub)">${c.c}</td><td>${lv(c.lv)}</td><td><span class="srclink" onclick="openSource('${c.n}')">详情</span></td><td><a class="linkbtn" href="${c.url}" target="_blank" rel="noopener noreferrer">${EXT} 官网</a></td></tr>`).join("")}
 </tbody></table></div>`;
}

function renderAbout(){
 return `<h2 class="sec">关于本站</h2>

 <span class="tag a-tea">教师向</span> 科研进展、人事事务、党团思政、青年教师成长类<br>

function renderArticle(id){
 let n=NEWS.find(x=>x.id==id);
 if(!n){S.p="home";render();return}
 let rel=NEWS.filter(x=>x.c===n.c&&x.id!==n.id&&x.aud===n.aud).slice(0,4);
 if(!rel.length)rel=NEWS.filter(x=>x.c===n.c&&x.id!==n.id).slice(0,4);
 return `<span class="back" onclick="go('home')">← 返回</span>
 <div class="card article"><h1>${n.t}</h1>
 <div class="meta">${audTag(n.aud)}${cat(n.c)}${lv(n.lv)}<span>${n.d}</span></div>
 <div class="abbr"><strong>摘要</strong><br>${n.s}</div>
 <div class="body">${n.b.split("。").filter(x=>x.trim()).map(p=>`<p>${p}。</p>`).join("")}</div>
 <div class="srcbox"><h4>来源信息</h4><dl>
  <dt>来源栏目</dt><dd>${n.col}</dd>
  <dt>发布机构</dt><dd>${n.org}</dd>
  <dt>作者</dt><dd>${n.by}</dd>
  <dt>发布日期</dt><dd>${n.d}</dd>
  <dt>适用人群</dt><dd>${n.aud==='both'?'师生通用':AUD[n.aud]}</dd>
  <dt>关联来源</dt><dd><span class="srclink" onclick="openSource('${chNameOf(n)}')">${chNameOf(n)} · 查看来源详情</span></dd>
  <dt>原文链接</dt><dd><a class="ext urllink" href="${n.url}" target="_blank" rel="noopener noreferrer"><span class="u">${n.url}</span> ${EXTT}</a></dd>
 </dl>
 <div style="font-size:12px;color:var(--sub);margin-top:12px;padding-top:12px;border-top:1px solid var(--line)">本文内容摘自上述渠道发布原文，版权归原发布单位所有。如有出入，以原文为准。</div>
 </div></div>
 <h2 class="sec">相关阅读</h2>
 <div class="card list">${rel.map(item).join("")||'<div class="empty" style="padding:24px"><p>暂无同类相关资讯</p></div>'}</div>`;
}

function render(){
 document.getElementById("nav").querySelectorAll("a").forEach(a=>a.classList.toggle("on",a.dataset.p===S.p));
 let h;
 if(S.p==="article")h=renderArticle(S.id);
 else if(S.p==="home"||S.p==="student"||S.p==="teacher")h=renderFeed();
 else if(S.p==="timeline")h=renderTimeline();
 else if(S.p==="sources")h=renderSources();
 else if(S.p==="category")h=renderCategory();
 else if(S.p==="channels")h=renderChannels();
 else h=renderAbout();
 document.getElementById("main").innerHTML=h;
}
function go(p){
 S.p=p;
 if(p==="student"){S.aud="stu";S.cat=null}
 else if(p==="teacher"){S.aud="tea";S.cat=null}
 else if(p==="home"){S.aud="all";S.cat=null}
 render();window.scrollTo(0,0)
}
function goAud(a){S.aud=a;S.p=(a==='all'?'home':a);render();window.scrollTo(0,0)}
function setAud(a){S.aud=a;render()}
function setCat(c){S.cat=S.cat===c?null:c;if(S.cat)S.p="category";render()}
function setSort(v){S.sort=v;render()}
function openArticle(id){S.p="article";S.id=id;render();window.scrollTo(0,0)}
function resetAll(){S.cat=null;S.q="";S.aud="all";S.sort="date";const i=document.getElementById("q");if(i)i.value="";go("home")}
function doSearch(){S.q=document.getElementById("q").value.trim();S.p="home";render();window.scrollTo(0,0)}
let tmr=null;
document.getElementById("q").addEventListener("input",e=>{
 clearTimeout(tmr);
 const v=e.target.value, pos=e.target.selectionStart;
 tmr=setTimeout(()=>{
  S.q=v.trim();
  if(S.p!=="sources"&&S.p!=="home")S.p="home";
  render();
  const n=document.getElementById("q");
  if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}
 },260);
});

document.getElementById("nav").addEventListener("click",e=>{
 let a=e.target.closest("a");if(!a)return;e.preventDefault();go(a.dataset.p);
});
